<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход | HelpMate</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#main">Перейти к содержанию</a>
  <header class="site-header"><div class="container nav-shell">
    <a class="brand" href="index.html"><span class="brand-mark">HM</span><span>HelpMate</span></a>
    <nav class="main-nav"><a href="index.html">Главная</a><a href="jobs.html">Вакансии</a><a href="students.html">Студенты</a><a href="about.html">О проекте</a></nav>
    <div class="nav-auth"><a class="button button-primary button-small" href="register.html">Регистрация</a></div>
    <details class="mobile-menu"><summary class="button button-secondary button-small">Меню</summary><nav class="mobile-panel"><a href="index.html">Главная</a><a href="jobs.html">Вакансии</a><a href="students.html">Студенты</a><a href="register.html">Регистрация</a></nav></details>
  </div></header>
  <main id="main" class="page-main">
    <div class="container auth-shell">
      <section class="auth-card">
        <h1>С возвращением</h1>
        <p>Войдите, чтобы управлять анкетой, вакансиями и сообщениями.</p>
        <form class="auth-form" action="profile.html">
          <div class="field"><label for="email">Электронная почта</label><input class="input" id="email" type="email" placeholder="name@example.kz" autocomplete="email" required></div>
          <div class="field"><label for="password">Пароль</label><input class="input" id="password" type="password" placeholder="Введите пароль" autocomplete="current-password" required><small>Не менее 8 символов.</small></div>
          <label class="checkbox-row"><input type="checkbox">Запомнить меня на этом устройстве</label>
          <button class="button button-primary" type="submit">Войти</button>
        </form>
        <p class="auth-footer">Нет аккаунта? <a href="register.html">Создать аккаунт</a></p>
      </section>
    </div>
  </main>
</body>
</html>
